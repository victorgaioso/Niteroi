<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Niterói — Contratos Andaluz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#003354;--navy2:#004a78;--navy3:#5f86a6;--gold:#C4854D;--bg:#f4f5f7;--card:#ffffff;
  --text:#1c2b3a;--text2:#5b6a7a;--text3:#8a97a5;--border:#e3e6eb;--surface2:#eef2f7;
  --green:#1d9e75;--amber:#C4854D;--red:#c0392b;--gray:#b8c2cc;
  --font:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;}
.logo-img{display:block;object-fit:contain;}

/* ---- Login ---- */
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,#001a2c 100%);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.login-box{background:var(--card);border-radius:12px;overflow:hidden;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login-head{background:var(--navy);padding:26px 20px 18px;}
.login-head .logo-img{height:120px;margin:0 auto;}
.login-body{padding:26px 34px 32px;}
.login-body h1{font-size:1.2rem;color:var(--navy);margin-bottom:4px;}
.login-body p{color:var(--text2);font-size:.88rem;margin-bottom:20px;}
.login-body input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem;text-align:center;letter-spacing:2px;margin-bottom:14px;}
.login-body button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;}
.login-body button:hover{background:var(--navy2);}
.login-body button:disabled{opacity:.6;cursor:wait;}
.login-error{color:var(--red);font-size:.85rem;margin-top:10px;display:none;}

/* ---- Layout ---- */
#dashboard{display:none;}
header.topbar{background:var(--navy);color:#fff;padding:16px 32px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;}
header.topbar .brand-block{display:flex;align-items:center;gap:14px;}
header.topbar .logo-img{height:58px;}
header.topbar .brand{font-weight:700;font-size:1.05rem;}
header.topbar .subtitle{font-size:.82rem;color:#c7d2e0;margin-top:2px;}
.top-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;gap:2px;}
.seg button{border:none;background:transparent;color:#c7d2e0;padding:7px 14px;border-radius:6px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:var(--font);}
.seg button.active{background:#fff;color:var(--navy);}
.seg button:not(.active):hover{color:#fff;}
.btn-xlsx{display:flex;align-items:center;gap:6px;padding:7px 12px;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:6px;font-size:.8rem;color:#fff;cursor:pointer;font-family:var(--font);}
.btn-xlsx:hover{background:rgba(29,158,117,.25);border-color:var(--green);}
.btn-xlsx svg{width:14px;height:14px;}
.refdate{font-size:.78rem;color:#c7d2e0;}

nav.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:10;}
nav.tabs button{border:none;background:transparent;padding:14px;font-size:.82rem;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-family:var(--font);}
nav.tabs button:hover{color:var(--navy);}
nav.tabs button.active{color:var(--navy);border-bottom-color:var(--gold);}

main{max-width:1180px;margin:0 auto;padding:26px 24px 70px;}
section.page{display:none;}
section.page.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

h2.section-title{background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-size:1.05rem;margin-bottom:6px;}
.section-subtitle{color:var(--gold);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.6px;margin-bottom:18px;}
h3.subhead{color:var(--navy);font-size:.92rem;text-transform:uppercase;letter-spacing:.4px;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
h3.subhead::before{content:'';width:8px;height:8px;background:var(--navy);display:inline-block;border-radius:2px;}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
.grid-3-2{grid-template-columns:3fr 2fr;}
@media(max-width:900px){.grid-5{grid-template-columns:repeat(2,1fr);}.grid-3-2{grid-template-columns:1fr;}}
@media(max-width:760px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;}header.topbar{padding:14px 16px;}main{padding:20px 16px 60px;}}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;position:relative;}
.kpi{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:8px;padding:14px 16px;position:relative;}
.kpi .label{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
.kpi .value{font-size:1.25rem;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
.kpi .sub{font-size:.76rem;color:var(--text3);margin-top:2px;}
.kpi.accent{border-left-color:var(--navy);}
.kpi.alert{border-left-color:var(--red);}

.chart-title{color:var(--navy);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px;padding-right:28px;}
.chart-note{color:var(--text2);font-size:.8rem;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.chart-note b{color:var(--navy);}
.chart-wrap{position:relative;height:290px;width:100%;}
.chart-wrap.short{height:230px;}

/* progress */
.prog{margin:4px 0 14px;}
.prog:last-child{margin-bottom:0;}
.prog .row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text2);margin-bottom:5px;}
.prog .row b{color:var(--navy);font-variant-numeric:tabular-nums;}
.track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;display:flex;gap:2px;}
.track .fill{height:100%;background:var(--navy);border-radius:5px;}
.track .fill.gold{background:var(--gold);}
.track .fill.green{background:var(--green);}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--text2);margin-bottom:8px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.legend i.dash{background:transparent!important;border:1.5px dashed var(--navy3);}

/* tables */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.85rem;}
table th{text-align:left;background:var(--gold);color:#fff;font-weight:600;padding:9px 10px;font-size:.74rem;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
table tr:first-child th:first-child{border-top-left-radius:8px;}
table tr:first-child th:last-child{border-top-right-radius:8px;}
table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
table tr:last-child td{border-bottom:none;}
table td.num,table th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
table td.c,table th.c{text-align:center;}
table tr.total td{font-weight:700;color:var(--navy);background:var(--surface2);border-bottom:none;}
table tbody tr:hover td{background:#fafbfc;}
.table-wrap{overflow-x:auto;border-radius:10px;}
.muted{color:var(--text3);}
.small{font-size:.76rem;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.b-pago{background:rgba(29,158,117,.12);color:var(--green);}
.b-aguard{background:rgba(196,133,77,.15);color:#9a5f2a;}
.b-proc{background:rgba(0,74,120,.1);color:var(--navy2);}
.b-prev{background:#eef0f3;color:var(--text2);}
.b-and{background:rgba(0,74,120,.1);color:var(--navy2);}
.b-c2025{background:rgba(0,51,84,.1);color:var(--navy);}
.b-c2026{background:rgba(196,133,77,.15);color:#9a5f2a;}
.b-cx::before{display:none;}

/* pipeline dots */
.pipe{display:inline-flex;gap:4px;}
.pipe span{width:13px;height:13px;border-radius:50%;border:2px solid var(--gray);display:inline-block;}
.pipe span.on{background:var(--green);border-color:var(--green);}

/* matrix */
.matrix td,.matrix th{padding:6px 4px;}
.matrix td.lbl{padding-left:10px;white-space:nowrap;}
.matrix td.cell{text-align:center;}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle;}
.dot.done{background:var(--navy);}
.dot.plan{border:2px dashed var(--navy3);}
.dot.none{width:6px;height:6px;background:var(--border);}
.ente{font-size:.68rem;font-weight:700;color:var(--text3);margin-left:6px;}

.itemrow{margin-bottom:14px;}
.itemrow .top{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;margin-bottom:5px;}
.itemrow .top .n{color:var(--text);}
.itemrow .top .v{color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.itemrow .top .v b{color:var(--navy);}

.callout{background:var(--surface2);border-left:4px solid var(--navy);border-radius:8px;padding:12px 16px;color:var(--text2);font-size:.85rem;margin-bottom:16px;}
.callout b{color:var(--navy);}

/* PNG btn */
.btn-png{position:absolute;top:10px;right:10px;z-index:5;width:24px;height:24px;border-radius:4px;border:none;background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;color:var(--text3);}
.card:hover .btn-png,.kpi:hover .btn-png{opacity:1;}
.btn-png:hover{background:var(--surface2);color:var(--text2);}
.btn-png svg{width:14px;height:14px;}
.kpi .btn-png{top:6px;right:6px;}

footer.pagefoot{text-align:center;color:var(--text2);font-size:.76rem;padding:26px 0 10px;}
.contract-block{margin-bottom:26px;}
.contract-block:last-child{margin-bottom:0;}
</style>
</head>

/* ---------------- crypto ---------------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function checkPassword(pw){
  const input = document.getElementById('senha-input'), btn = document.getElementById('btn-login');
  pw = pw || input.value.trim();
  if(!pw) return;
  btn.disabled = true; btn.textContent = 'Verificando…';
  try{
    D = await decrypt(pw);
    try{ sessionStorage.setItem('nit_pw', pw); }catch(e){}
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    init();
  }catch(e){
    document.getElementById('senha-erro').style.display = 'block';
    btn.disabled = false; btn.textContent = 'Acessar';
  }
}

/* ---------------- model ---------------- */
const CCOLOR = ['#003354','#C4854D','#5f86a6','#8a97a5'];
const STATUS = {
  pago:   {lbl:'Pago', cls:'b-pago', color:'#1d9e75'},
  aguard: {lbl:'Aguardando pagamento', cls:'b-aguard', color:'#C4854D'},
  proc:   {lbl:'Em processamento', cls:'b-proc', color:'#004a78'},
  and:    {lbl:'Em andamento', cls:'b-and', color:'#5f86a6'},
  prev:   {lbl:'Previsto', cls:'b-prev', color:'#b8c2cc'},
};
function prepare(){
  const ref = D.ref.slice(0,7);
  D.refMonth = ref;
  D.contracts.forEach((c, ci) => {
    c.color = CCOLOR[ci % CCOLOR.length]; c.idx = ci;
    const price = {}; c.items.forEach(i => price[i.cod] = i.unit);
    // quantidade ainda por entregar de cada entregável -> base da previsão
    const left = {}; D.deliv_keys.forEach(k => left[k] = c.expected[k] - c.months.filter(m => m.ent[k]).length);
    const future = c.months.filter(m => m.total === 0);
    const adic = future.filter(m => /adicional/i.test(m.tipo));
    c.months.forEach(m => {
      m.contract = c;
      m.plan = {};
      if(m.total === 0){
        D.deliv_keys.forEach(k => {
          const base = k.split(' ')[0];
          let on = false;
          if(['2.4.1','2.3','2.1.1'].includes(base)) on = left[k] > 0 && future.indexOf(m) < left[k];
          else if(base === '2.1.2') on = adic.indexOf(m) >= 0 && adic.indexOf(m) < left[k];
          else on = adic.length ? m === adic[adic.length-1] && left[k] > 0 : m === future[future.length-1] && left[k] > 0;
          m.plan[k] = on;
        });
        m.previsto = D.deliv_keys.reduce((s,k) => s + (m.plan[k] ? price[k.split(' ')[0]] : 0), 0);
      } else m.previsto = 0;
      // status
      if(m.pago) m.st = 'pago';
      else if(m.envio) m.st = 'aguard';
      else if(m.total > 0) m.st = 'proc';
      else if(m.comp === ref) m.st = 'and';
      else if(m.comp > ref) m.st = 'prev';
      else m.st = 'proc';
      m.stLbl = m.pago ? 'Pago' : m.envio ? 'Aguardando pagamento' : m.nota ? 'Nota a enviar' : m.validado ? 'Nota a gerar'
              : m.total > 0 ? 'A validar' : m.st === 'and' ? 'Em andamento' : m.st === 'prev' ? 'Previsto' : 'Entrega pendente';
      m.aberto = (m.envio && !m.pago) ? m.total : 0;
      m.abertoLiq = (m.envio && !m.pago) ? m.liquido : 0;
    });
    c.s = summarize([c]);
  });
}
const mesesTxt = n => n === 1 ? '1 mês' : n + ' meses';
function monthsDiff(a, b){ const [ya,ma] = a.split('-').map(Number), [yb,mb] = b.split('-').map(Number); return (yb-ya)*12 + (mb-ma); }
function summarize(cs){
  const ms = cs.flatMap(c => c.months);
  const sum = f => ms.reduce((s,m) => s + f(m), 0);
  const exp = cs.reduce((s,c) => s + D.deliv_keys.reduce((t,k) => t + c.expected[k], 0), 0);
  const done = sum(m => D.deliv_keys.filter(k => m.ent[k]).length);
  const contratado = cs.reduce((s,c) => s + c.contratado, 0);
  const gerado = sum(m => m.total);
  return {
    contratado, gerado,
    validado: sum(m => m.validado ? m.total : 0), nota: sum(m => m.nota ? m.total : 0),
    envio: sum(m => m.envio ? m.total : 0), pago: sum(m => m.pago ? m.total : 0),
    aberto: sum(m => m.aberto), abertoLiq: sum(m => m.abertoLiq),
    nAberto: ms.filter(m => m.aberto > 0).length,
    faltaFaturar: contratado - gerado, previsto: sum(m => m.previsto),
    exp, done, progresso: exp ? done/exp : 0,
  };
}

const title = (t) => `<h2 class="section-title">${t}</h2><div class="section-subtitle">${viewName()}</div>`;
const kpi = (label, value, sub, cls='') => `<div class="kpi ${cls}"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
const prog = (label, v, cls='', right) => `<div class="prog"><div class="row"><span>${label}</span><b>${right || pct(v)}</b></div><div class="track"><div class="fill ${cls}" style="width:${Math.min(100, v*100).toFixed(1)}%"></div></div></div>`;
const cBadge = c => `<span class="badge b-cx b-c${c.id}" style="${c.idx>1?'background:#eef0f3;color:#5b6a7a':''}">${c.id}</span>`;
const sBadge = m => `<span class="badge ${STATUS[m.st].cls}">${m.stLbl}</span>`;

/* ---------------- chart defaults ---------------- */
Chart.defaults.font.family = "'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = '#5b6a7a';
const gridColor = '#eef0f3';
const tipBRL = { callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + brl(ctx.raw) } };
const axisBRL = { grid:{color:gridColor}, border:{display:false}, ticks:{ callback: v => v >= 1000 ? (v/1000).toLocaleString('pt-BR') + ' mil' : v } };

/* ================= PAGES ================= */
const PAGES = {}, AFTER = {};

/* ---- Visão geral ---- */
PAGES.geral = () => {
  const s = summarize(viewContracts());
  const multi = VIEW === 'all';
  let html = title('Visão geral');
  html += `<div class="grid grid-5">
    ${kpi('Valor contratado', brlk(s.contratado), multi ? D.contracts.length + ' contratos' : '12 competências')}
    ${kpi('Receita gerada', brlk(s.gerado), pct(s.gerado/s.contratado) + ' do contratado', 'accent')}
    ${kpi('Nota enviada', brlk(s.envio), pct(s.envio/s.contratado) + ' do contratado', 'accent')}
    ${kpi('Recebido', brlk(s.pago), pct(s.pago/s.contratado) + ' do contratado', 'accent')}
    ${kpi('A receber', brlk(s.aberto), s.nAberto + ' competência' + (s.nAberto===1?'':'s') + ' em aberto', s.aberto > 0 ? 'alert' : '')}
  </div>
  <div class="grid grid-3-2" style="margin-top:16px">
    <div class="card"><div class="chart-title">Faturamento por competência</div>
      <div class="legend">${['pago','aguard','proc','and'].map(k => `<span><i style="background:${STATUS[k].color}"></i>${STATUS[k].lbl}</span>`).join('')}<span><i class="dash"></i>Previsto</span></div>
      <div class="chart-wrap"><canvas id="ch-comp"></canvas></div>
      <div class="chart-note">Valor bruto de cada competência pela etapa em que está. Competências futuras mostram o valor <b>previsto</b> pelos entregáveis que ainda faltam.</div>
    </div>
    <div class="card"><div class="chart-title">Andamento</div>
      ${prog('Receita gerada', s.gerado/s.contratado)}
      ${prog('Receita paga', s.pago/s.contratado, 'green')}
      ${prog('Progresso da prestação', s.progresso, 'gold', pct(s.progresso) + ` <span class="muted small">(${s.done}/${s.exp})</span>`)}
      <div class="chart-title" style="margin-top:22px">Funil do contratado</div>
      ${multi ? `<div class="legend">${D.contracts.map(c => `<span><i style="background:${c.color}"></i>${c.label}</span>`).join('')}</div>` : ''}
      <div class="chart-wrap short"><canvas id="ch-funil"></canvas></div>
    </div>
  </div>`;
  if(multi){
    html += `<h3 class="subhead">Resumo por contrato</h3><div class="card"><div class="chart-title">Situação de cada contrato</div><div class="table-wrap"><table>
      <thead><tr><th>Contrato</th><th class="num">Contratado</th><th class="num">Gerado</th><th class="num">Recebido</th><th class="num">A receber</th><th class="num">Falta faturar</th><th class="num">Prestação</th></tr></thead><tbody>
      ${D.contracts.map(c => `<tr><td>${cBadge(c)} ${c.ref}</td><td class="num">${brl(c.s.contratado)}</td><td class="num">${brl(c.s.gerado)}</td><td class="num">${brl(c.s.pago)}</td><td class="num"><b>${brl(c.s.aberto)}</b></td><td class="num">${brl(c.s.faltaFaturar)}</td><td class="num">${pct(c.s.progresso)}</td></tr>`).join('')}
      <tr class="total"><td>Total</td><td class="num">${brl(s.contratado)}</td><td class="num">${brl(s.gerado)}</td><td class="num">${brl(s.pago)}</td><td class="num">${brl(s.aberto)}</td><td class="num">${brl(s.faltaFaturar)}</td><td class="num">${pct(s.progresso)}</td></tr>
      </tbody></table></div></div>`;
  }
  return html;
};
AFTER.geral = () => {
  const ms = viewMonths();
  const labels = ms.map(m => compLbl(m.comp));
  const ds = ['pago','aguard','proc','and'].map(k => ({
    label: STATUS[k].lbl, data: ms.map(m => m.st === k ? m.total : 0), backgroundColor: STATUS[k].color,
    borderRadius:4, borderSkipped:'bottom', stack:'s', maxBarThickness:34 }));
  ds.push({ label:'Previsto', data: ms.map(m => m.total === 0 ? m.previsto : 0), backgroundColor:'rgba(95,134,166,.12)',
    borderColor:'#5f86a6', borderWidth:1.5, borderDash:[4,3], borderRadius:4, borderSkipped:'bottom', stack:'s', maxBarThickness:34 });
  charts.comp = new Chart(document.getElementById('ch-comp'), { type:'bar', data:{labels, datasets:ds},
    options:{ maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{ filter: i => i.raw > 0,
      callbacks:{ title: it => { const m = ms[it[0].dataIndex]; return compLbl(m.comp) + (VIEW==='all' ? ' · ' + m.contract.label : '') + ' · ' + m.tipo; },
                  label: ctx => ' ' + (ctx.dataset.label === 'Previsto' ? 'Previsto' : ms[ctx.dataIndex].stLbl) + ': ' + brl(ctx.raw) } } },
      scales:{ x:{stacked:true, grid:{display:false}, ticks:{maxRotation:0, autoSkip:true}}, y:{stacked:true, ...axisBRL} } } });
  // funil
  const stages = [['Contratado','contratado'],['Validado','validado'],['Nota gerada','nota'],['Nota enviada','envio'],['Pago','pago']];
  const cs = viewContracts();
  charts.funil = new Chart(document.getElementById('ch-funil'), { type:'bar',
    data:{ labels: stages.map(s => s[0]), datasets: cs.map(c => ({ label:c.label, data: stages.map(s => c.s[s[1]]), backgroundColor:c.color, borderRadius:4, borderSkipped:'left', stack:'f', barPercentage:.7 })) },
    options:{ indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:tipBRL},
      scales:{ x:{stacked:true, ...axisBRL}, y:{stacked:true, grid:{display:false}, border:{display:false}} } } });
};

/* ---- Recebíveis ---- */
PAGES.receber = () => {
  const s = summarize(viewContracts());
  const ab = viewMonths().filter(m => m.aberto > 0);
  const oldest = ab.length ? ab.reduce((a,b) => a.comp < b.comp ? a : b) : null;
  let html = title('Recebíveis');
  html += `<div class="grid grid-4">
    ${kpi('A receber (bruto)', brl(s.aberto), 'notas enviadas e não pagas', s.aberto > 0 ? 'alert' : '')}
    ${kpi('A receber (líquido)', brl(s.abertoLiq), 'após retenção de IRRF de ' + pct(D.irrf))}
    ${kpi('Competências em aberto', s.nAberto, ab.length ? 'de ' + compLbl(ab[0].comp) + ' a ' + compLbl(ab[ab.length-1].comp) : 'nenhuma pendência')}
    ${kpi('Mais antiga em aberto', oldest ? compLbl(oldest.comp) : '—', oldest ? mesesTxt(monthsDiff(oldest.comp, D.refMonth)) + ' desde a competência' : '', oldest ? 'alert' : '')}
  </div>`;
  if(!ab.length) return html + `<div class="card" style="margin-top:16px">Nenhuma nota em aberto nesta seleção.</div>`;
  html += `<div class="card" style="margin-top:16px"><div class="chart-title">Em aberto por competência</div>
    ${VIEW==='all' ? `<div class="legend">${D.contracts.map(c => `<span><i style="background:${c.color}"></i>${c.label}</span>`).join('')}</div>` : ''}
    <div class="chart-wrap short"><canvas id="ch-rec"></canvas></div></div>`;
  html += `<h3 class="subhead">Notas em aberto</h3><div class="card"><div class="chart-title">Detalhe das notas enviadas e não pagas</div><div class="table-wrap"><table>
    <thead><tr>${VIEW==='all'?'<th>Contrato</th>':''}<th>Competência</th><th>Tipo</th><th class="c">Nº NF</th><th class="num">Bruto</th><th class="num">Líquido</th><th class="num">Em aberto há</th></tr></thead><tbody>
    ${ab.map(m => `<tr>${VIEW==='all'?`<td>${cBadge(m.contract)}</td>`:''}<td>${compLbl(m.comp)}</td><td class="muted">${m.tipo}</td><td class="c">${m.nf ? esc(m.nf) : '<span class="muted">—</span>'}</td>
      <td class="num">${brl(m.total)}</td><td class="num">${brl(m.liquido)}</td><td class="num">${mesesTxt(monthsDiff(m.comp, D.refMonth))}</td></tr>`).join('')}
    <tr class="total">${VIEW==='all'?'<td></td>':''}<td colspan="3">Total</td><td class="num">${brl(s.aberto)}</td><td class="num">${brl(s.abertoLiq)}</td><td></td></tr>
    </tbody></table></div>
    <div class="chart-note">Prazo em aberto contado em meses desde a competência da prestação. Líquido = bruto − IRRF de ${pct(D.irrf)}.</div></div>`;
  return html;
};
AFTER.receber = () => {
  const el = document.getElementById('ch-rec'); if(!el) return;
  const ab = viewMonths().filter(m => m.aberto > 0);
  const cs = viewContracts();
  charts.rec = new Chart(el, { type:'bar', data:{ labels: ab.map(m => compLbl(m.comp) + (VIEW==='all' ? '' : '')),
    datasets: cs.map(c => ({ label:c.label, data: ab.map(m => m.contract === c ? m.aberto : 0), backgroundColor:c.color, borderRadius:4, borderSkipped:'bottom', stack:'r', maxBarThickness:40 })) },
    options:{ maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{ filter:i => i.raw > 0, callbacks:{ label: ctx => ' ' + ctx.dataset.label + ': ' + brl(ctx.raw) + (ab[ctx.dataIndex].nf ? ' · NF ' + ab[ctx.dataIndex].nf : '') } } },
      scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true, ...axisBRL} } } });
};

/* ---- Execução do TR ---- */
function delivLabel(k){ const [cod, ente] = k.split(' '); return `<b>${cod}</b> ${D.deliv_label[cod] || ''}${ente ? `<span class="ente">${ente === 'TES' ? 'TESOURO' : ente}</span>` : ''}`; }
PAGES.exec = () => {
  const cs = viewContracts(); const s = summarize(cs);
  let html = title('Execução do Termo de Referência');
  html += `<div class="grid grid-3">
    ${kpi('Progresso da prestação', pct(s.progresso), s.done + ' de ' + s.exp + ' entregáveis', 'accent')}
    ${kpi('Receita gerada', brl(s.gerado), pct(s.gerado/s.contratado) + ' do contratado')}
    ${kpi('Falta faturar', brl(s.faltaFaturar), 'entregáveis ainda por executar')}
  </div>`;
  cs.forEach(c => {
    const ms = c.months;
    html += `<div class="contract-block"><h3 class="subhead">${c.label} · ${c.ref}</h3>
    <div class="card"><div class="chart-title">Entregas por competência</div>
      <div class="legend"><span><i style="background:var(--navy);border-radius:50%"></i>Entregue</span><span><i class="dash" style="border-radius:50%"></i>Previsto</span></div>
      <div class="table-wrap"><table class="matrix"><thead><tr><th>Entregável</th>${ms.map(m => `<th class="c">${compLbl(m.comp)}</th>`).join('')}<th class="c">Feito</th></tr></thead><tbody>
      ${D.deliv_keys.map(k => { const done = ms.filter(m => m.ent[k]).length;
        return `<tr><td class="lbl">${delivLabel(k)}</td>${ms.map(m => `<td class="cell">${m.ent[k] ? '<span class="dot done" title="Entregue"></span>' : m.plan[k] ? '<span class="dot plan" title="Previsto"></span>' : '<span class="dot none"></span>'}</td>`).join('')}
        <td class="c"><b style="color:${done >= c.expected[k] ? 'var(--green)' : 'var(--navy)'}">${done}/${c.expected[k]}</b></td></tr>`; }).join('')}
      </tbody></table></div></div>
    <div class="card" style="margin-top:16px"><div class="chart-title">Execução financeira por item do TR</div>
      ${c.items.map(it => { const g = ms.reduce((s,m) => s + D.deliv_keys.filter(k => k.split(' ')[0] === it.cod).reduce((t,k) => t + m.vals[k], 0), 0);
        return `<div class="itemrow"><div class="top"><span class="n"><b style="color:var(--navy)">${it.cod}</b> ${esc(it.desc)}</span><span class="v"><b>${brl(g)}</b> de ${brl(it.valor)} · ${pct(g/it.valor)}</span></div>
        <div class="track"><div class="fill" style="width:${(g/it.valor*100).toFixed(1)}%;background:${c.color}"></div></div></div>`; }).join('')}
    </div></div>`;
  });
  return html;
};

/* ---- Cronograma ---- */
PAGES.crono = () => {
  const cs = viewContracts();
  let html = title('Cronograma de competências');
  html += `<div class="callout">Cada competência passa por quatro etapas: <b>Validado → Nota gerada → Nota enviada → Pago</b>. As bolinhas mostram as etapas já concluídas.</div>`;
  cs.forEach(c => {
    html += `<div class="contract-block"><h3 class="subhead">${c.label} · ${c.ref}</h3><div class="card"><div class="chart-title">Competências — ${c.label}</div><div class="table-wrap"><table>
      <thead><tr><th>Competência</th><th>Tipo</th><th class="num">Valor bruto</th><th class="c">Etapas</th><th>Status</th><th class="c">Nº NF</th><th class="c">Pagamento</th><th>Observações</th></tr></thead><tbody>
      ${c.months.map(m => `<tr><td><b>${compLbl(m.comp)}</b> <span class="muted small">mês ${m.n}</span></td><td class="muted">${m.tipo}</td>
        <td class="num">${m.total ? brl(m.total) : `<span class="muted">${m.previsto ? brl(m.previsto) + ' prev.' : '—'}</span>`}</td>
        <td class="c"><span class="pipe" title="Validado · Nota gerada · Nota enviada · Pago">${['validado','nota','envio','pago'].map(k => `<span class="${m[k]?'on':''}"></span>`).join('')}</span></td>
        <td>${sBadge(m)}</td><td class="c">${m.nf ? esc(m.nf) : '<span class="muted">—</span>'}</td><td class="c">${dtBR(m.dt_pag) || '<span class="muted">—</span>'}</td><td class="small">${esc(m.obs)}</td></tr>`).join('')}
      <tr class="total"><td colspan="2">Total</td><td class="num">${brl(c.s.gerado)}</td><td colspan="5" class="small">Recebido ${brl(c.s.pago)} · A receber ${brl(c.s.aberto)} · Falta faturar ${brl(c.s.faltaFaturar)}</td></tr>
      </tbody></table></div></div></div>`;
  });
  return html;
};

/* ---- Contrato ---- */
PAGES.contrato = () => {
  const cs = viewContracts(); const s = summarize(cs);
  const fut = viewMonths().filter(m => m.previsto > 0);
  let html = title('Contrato e previsão de faturamento');
  html += `<div class="grid grid-4">
    ${kpi('Valor contratado', brl(s.contratado), VIEW==='all' ? 'soma dos contratos' : cs[0].ref)}
    ${kpi('Falta faturar', brl(s.faltaFaturar), fut.length + ' competência' + (fut.length===1?'':'s') + ' pela frente', 'accent')}
    ${kpi('Próxima competência', fut.length ? compLbl(fut[0].comp) : '—', fut.length ? brl(fut[0].previsto) + ' previsto' : 'contrato concluído')}
    ${kpi('Última competência', compLbl(viewMonths()[viewMonths().length-1].comp), 'término do período de prestação')}
  </div>`;
  if(fut.length){
    html += `<div class="card" style="margin-top:16px"><div class="chart-title">Previsão de faturamento das competências futuras</div>
      <div class="chart-wrap short"><canvas id="ch-prev"></canvas></div>
      <div class="chart-note">Previsão pelos entregáveis que faltam: reuniões, plataforma e relatórios mensais todo mês, enquadramento nos meses <b>Adicionais</b> e prestação de contas + política no último mês Adicional. Soma prevista: <b>${brl(s.previsto)}</b>${Math.abs(s.previsto - s.faltaFaturar) < 0.05 ? ', igual ao saldo a faturar' : ` (saldo a faturar: ${brl(s.faltaFaturar)})`}.</div></div>`;
  }
  html += `<h3 class="subhead">Itens do Termo de Referência</h3><div class="card"><div class="chart-title">Valores por item</div><div class="table-wrap"><table>`;
  if(VIEW === 'all' && D.contracts.length > 1){
    const [a, b] = D.contracts.slice(-2);
    html += `<thead><tr><th>Item</th><th>Descrição</th>${D.contracts.map(c => `<th class="num">${c.label}</th>`).join('')}<th class="num">Reajuste ${a.id}→${b.id}</th></tr></thead><tbody>
      ${b.items.map(it => { const pa = a.items.find(x => x.cod === it.cod);
        return `<tr><td><b>${it.cod}</b></td><td>${esc(it.desc)}</td>${D.contracts.map(c => { const x = c.items.find(y => y.cod === it.cod); return `<td class="num">${x ? brl(x.valor) : '—'}</td>`; }).join('')}<td class="num">${pa ? pct(it.valor/pa.valor - 1) : '—'}</td></tr>`; }).join('')}
      <tr class="total"><td colspan="2">Total</td>${D.contracts.map(c => `<td class="num">${brl(c.contratado)}</td>`).join('')}<td class="num">${pct(b.contratado/a.contratado - 1)}</td></tr></tbody>`;
  } else {
    const c = cs[0];
    html += `<thead><tr><th>Item</th><th>Descrição</th><th class="c">Entregas no ano</th><th class="num">Valor anual</th><th class="num">Valor por entrega</th></tr></thead><tbody>
      ${c.items.map(it => `<tr><td><b>${it.cod}</b></td><td>${esc(it.desc)}</td><td class="c">${it.split}${it.split !== it.qtd ? ` <span class="muted small">(${it.qtd} FER + ${it.qtd} Tesouro)</span>` : ''}</td><td class="num">${brl(it.valor)}</td><td class="num">${brl(it.unit)}</td></tr>`).join('')}
      <tr class="total"><td colspan="3">Total</td><td class="num">${brl(c.contratado)}</td><td></td></tr></tbody>`;
  }
  html += `</table></div></div>`;
  return html;
};
AFTER.contrato = () => {
  const el = document.getElementById('ch-prev'); if(!el) return;
  const fut = viewMonths().filter(m => m.previsto > 0);
  charts.prev = new Chart(el, { type:'bar', data:{ labels: fut.map(m => compLbl(m.comp)),
    datasets:[{ label:'Previsto', data: fut.map(m => m.previsto), backgroundColor: fut.map(m => m.contract.color + '33'), borderColor: fut.map(m => m.contract.color), borderWidth:1.5, borderDash:[4,3], borderRadius:4, borderSkipped:'bottom', maxBarThickness:40 }] },
    options:{ maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{ callbacks:{ title: it => { const m = fut[it[0].dataIndex]; return compLbl(m.comp) + ' · ' + m.tipo; }, label: ctx => ' Previsto: ' + brl(ctx.raw) } } },
      scales:{ x:{grid:{display:false}}, y:axisBRL } } });
};

/* ================= Downloads ================= */
function loadScript(src){ return new Promise((res, rej) => { if(document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
const PNG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>';
const sanitize = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'');
function injectPng(){
  document.querySelectorAll('#main .card, #main .kpi').forEach(el => {
    const t = (el.querySelector('.chart-title') || el.querySelector('.label') || {}).textContent || 'card';
    const b = document.createElement('button'); b.className = 'btn-png'; b.title = 'Baixar PNG'; b.innerHTML = PNG_ICON;
    b.onclick = async ev => { ev.stopPropagation();
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      b.style.display = 'none';
      const cv = await html2canvas(el, {scale:3, backgroundColor:'#ffffff', useCORS:true});
      b.style.display = '';
      const a = document.createElement('a'); a.download = `Andaluz_Niteroi_${sanitize(t)}_${VIEW === 'all' ? 'Consolidado' : VIEW}.png`; a.href = cv.toDataURL('image/png'); a.click(); };
    el.appendChild(b);
  });
}
async function exportXlsx(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const cs = viewContracts(); const wb = XLSX.utils.book_new();
  const res = [['Contrato','Contratado','Gerado','Nota enviada','Recebido','A receber (bruto)','A receber (líquido)','Falta faturar','Progresso da prestação']];
  cs.forEach(c => res.push([c.label, c.s.contratado, c.s.gerado, c.s.envio, c.s.pago, c.s.aberto, c.s.abertoLiq, c.s.faltaFaturar, c.s.progresso]));
  if(cs.length > 1){ const s = summarize(cs); res.push(['Total', s.contratado, s.gerado, s.envio, s.pago, s.aberto, s.abertoLiq, s.faltaFaturar, s.progresso]); }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(res), 'Resumo');
  const comp = [['Contrato','Competência','Nº mês','Tipo','Valor bruto','Valor líquido','Previsto','Validado','Nota gerada','Nota enviada','Pago','Status','Nº NF','Data emissão','Data envio','Data pagamento','Observações']];
  viewMonths().forEach(m => comp.push([m.contract.label, compLbl(m.comp), m.n, m.tipo, m.total, m.total ? m.liquido : 0, m.previsto, m.validado?'Sim':'Não', m.nota?'Sim':'Não', m.envio?'Sim':'Não', m.pago?'Sim':'Não', m.stLbl, m.nf, dtBR(m.dt_emissao), dtBR(m.dt_envio), dtBR(m.dt_pag), m.obs]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(comp), 'Competências');
  const ent = [['Contrato','Entregável','Previsto','Entregue']];
  cs.forEach(c => D.deliv_keys.forEach(k => ent.push([c.label, k + ' ' + (D.deliv_label[k.split(' ')[0]] || ''), c.expected[k], c.months.filter(m => m.ent[k]).length])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ent), 'Entregáveis');
  const its = [['Contrato','Item','Descrição','Entregas no ano','Valor anual','Valor por entrega']];
  cs.forEach(c => c.items.forEach(it => its.push([c.label, it.cod, it.desc, it.split, it.valor, it.unit])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(its), 'Itens TR');
  XLSX.writeFile(wb, `Andaluz_Niteroi_${VIEW === 'all' ? 'Consolidado' : VIEW}_${D.ref}.xlsx`);
}
</script>
</body>
